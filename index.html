<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Diarrhoea Care Guide (Under 5)</title>
  <style>
    /* Reset & Base Setup */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Main Container (Mobile-first card) */
    .app-card {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .header-title { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
    .btn-text-restart {
      background: none;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }
    .btn-text-restart:hover { background-color: #f8fafc; color: #0f172a; }

    /* Progress Indicator */
    .progress-section { display: flex; flex-direction: column; gap: 6px; }
    .progress-track { width: 100%; height: 8px; background-color: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background-color: #0284c7; transition: width 0.25s ease; }
    .progress-label { font-size: 0.85rem; font-weight: 600; color: #64748b; text-align: right; }

    /* Question Display */
    .question-wrapper {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 0;
    }
    .question-text { font-size: 1.35rem; font-weight: 600; color: #0f172a; line-height: 1.35; }

    /* Decision Buttons */
    .choice-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-choice {
      padding: 18px 12px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .btn-choice:active { transform: scale(0.97); }
    .btn-choice-yes { background-color: #0284c7; color: #ffffff; }
    .btn-choice-yes:hover { filter: brightness(0.92); }
    .btn-choice-no { background-color: #e2e8f0; color: #1e293b; }
    .btn-choice-no:hover { background-color: #cbd5e1; }

    /* Result Box & Badges */
    .result-section { display: flex; flex-direction: column; gap: 16px; text-align: center; }
    .result-pill {
      align-self: center;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 999px;
    }
    .result-content-box {
      border-radius: 12px;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.5;
      text-align: left;
    }

    /* Result Categories */
    .theme-emergency .result-pill { background-color: #fee2e2; color: #991b1b; }
    .theme-emergency .result-content-box { background-color: #fef2f2; border: 2px solid #ef4444; color: #7f1d1d; }

    .theme-clinic .result-pill { background-color: #fef3c7; color: #92400e; }
    .theme-clinic .result-content-box { background-color: #fffbeb; border: 2px solid #f59e0b; color: #78350f; }

    .theme-home .result-pill { background-color: #dcfce7; color: #166534; }
    .theme-home .result-content-box { background-color: #f0fdf4; border: 2px solid #22c55e; color: #14532d; }

    .theme-notice .result-pill { background-color: #e0f2fe; color: #0369a1; }
    .theme-notice .result-content-box { background-color: #f0f9ff; border: 2px solid #0284c7; color: #0c4a6e; }

    /* Required Disclaimers */
    .disclaimer-area {
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
    }

    .btn-full-restart {
      width: 100%;
      background-color: #0f172a;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-full-restart:hover { background-color: #1e293b; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <main class="app-card">
    <!-- Top Header -->
    <header class="header-bar">
      <span class="header-title">Diarrhoea Triage</span>
      <button id="btn-restart-top" class="btn-text-restart" type="button">Start over</button>
    </header>

    <!-- QUESTION VIEW -->
    <div id="question-view">
      <div class="progress-section">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-label" class="progress-label">Question 1 of 11</div>
      </div>

      <div class="question-wrapper">
        <h2 id="question-text" class="question-text">Loading question...</h2>
      </div>

      <div class="choice-buttons">
        <button id="btn-yes" class="btn-choice btn-choice-yes" type="button">Yes</button>
        <button id="btn-no" class="btn-choice btn-choice-no" type="button">No</button>
      </div>
    </div>

    <!-- RESULT VIEW (hidden at the start) -->
    <div id="result-view" class="result-section hidden">
      <div id="result-pill" class="result-pill"></div>
      <div id="result-content-box" class="result-content-box"></div>

      <!-- Required disclaimers -->
      <div class="disclaimer-area">
        <p><strong>This guide does not replace a health worker.</strong></p>
        <p>Based on WHO IMCI guidance.</p>
      </div>

      <button id="btn-restart-bottom" class="btn-full-restart" type="button">Start over</button>
    </div>
  </main>

  <script>
    /* ==========================================================================
       QUESTIONS (a simple list: edit the text, or add and remove questions here)
       The "type" tells the code how to treat each answer.
       IMPORTANT: danger signs must stay BEFORE every other check except the age check.
       ========================================================================== */
    const questions = [
      // 1. Age check
      { text: "Is the child under 5 years old?", type: "under5" },

      // 2-5. Danger signs (any "Yes" = EMERGENCY immediately)
      { text: "Is the child very sleepy, floppy, or hard to wake?", type: "danger" },
      { text: "Is the child unable to drink or breastfeed, or drinking very poorly?", type: "danger" },
      { text: "Has the child had a fit (convulsion)?", type: "danger" },
      { text: "Is the child vomiting everything they take?", type: "danger" },

      // 6. Young baby check (only after danger signs have been ruled out)
      { text: "Is the baby under 6 months old?", type: "under6m" },

      // 7-8. Clinic signs (any "Yes" = CLINIC SOON immediately)
      { text: "Is there blood in the stool?", type: "clinic" },
      { text: "Has the diarrhoea lasted 14 days or more?", type: "clinic" },

      // 9-11. Dehydration signs (count the "Yes" answers)
      { text: "Is the child restless or irritable?", type: "dehydration" },
      { text: "Do the child’s eyes look sunken?", type: "dehydration" },
      { text: "Is the child very thirsty, drinking eagerly?", type: "dehydration" }
    ];

    /* ==========================================================================
       RESULT SCREENS
       ========================================================================== */
    const results = {
      NOT_UNDER_5: {
        badge: "Notice",
        themeClass: "theme-notice",
        message: "This guide is only for children under 5. If the person is unwell, please see a health worker."
      },
      EMERGENCY: {
        badge: "EMERGENCY",
        themeClass: "theme-emergency",
        message: "Take the child to the nearest health facility now. If the child can drink, give small, frequent sips of ORS on the way, and keep breastfeeding."
      },
      CLINIC_SOON: {
        badge: "CLINIC SOON",
        themeClass: "theme-clinic",
        message: "Visit a health facility today. Keep giving ORS and fluids in the meantime."
      },
      HOME_CARE: {
        badge: "HOME CARE",
        themeClass: "theme-home",
        message: "Give ORS after each loose stool, keep feeding and breastfeeding, and give zinc as advised on the pack or by a health worker. Go to a clinic right away if the child becomes very sleepy, cannot drink, has a fit, or gets worse."
      }
    };

    /* ==========================================================================
       STATE AND PAGE ELEMENTS
       ========================================================================== */
    let currentIndex = 0;      // which question we are on
    let dehydrationCount = 0;  // how many dehydration signs were "Yes"

    const questionView = document.getElementById("question-view");
    const resultView = document.getElementById("result-view");
    const questionTextEl = document.getElementById("question-text");
    const progressFillEl = document.getElementById("progress-fill");
    const progressLabelEl = document.getElementById("progress-label");
    const resultPillEl = document.getElementById("result-pill");
    const resultContentEl = document.getElementById("result-content-box");

    const btnYes = document.getElementById("btn-yes");
    const btnNo = document.getElementById("btn-no");
    const btnRestartTop = document.getElementById("btn-restart-top");
    const btnRestartBottom = document.getElementById("btn-restart-bottom");

    /* ==========================================================================
       SHOWING THINGS ON SCREEN
       ========================================================================== */
    // Show the current question and update the progress bar
    function renderQuestion() {
      const q = questions[currentIndex];
      questionTextEl.textContent = q.text;

      const currentNumber = currentIndex + 1;
      const totalNumber = questions.length;
      progressLabelEl.textContent = `Question ${currentNumber} of ${totalNumber}`;
      progressFillEl.style.width = `${(currentNumber / totalNumber) * 100}%`;
    }

    // Show a final result screen
    function renderResult(resultKey) {
      const res = results[resultKey];

      questionView.classList.add("hidden");
      resultView.classList.remove("hidden");

      resultView.className = `result-section ${res.themeClass}`;
      resultPillEl.textContent = res.badge;
      resultContentEl.textContent = res.message;
    }

    /* ==========================================================================
       THE LOGIC: what happens when "Yes" or "No" is tapped
       ========================================================================== */
    function handleChoice(isYes) {
      const currentQ = questions[currentIndex];

      // Age check: "No" means the guide does not apply
      if (currentQ.type === "under5" && !isYes) {
        renderResult("NOT_UNDER_5");
        return;
      }

      // Danger signs: any "Yes" = EMERGENCY
      if (currentQ.type === "danger" && isYes) {
        renderResult("EMERGENCY");
        return;
      }

      // Young baby: "Yes" = CLINIC SOON (danger signs were already checked above)
      if (currentQ.type === "under6m" && isYes) {
        renderResult("CLINIC_SOON");
        return;
      }

      // Clinic signs: any "Yes" = CLINIC SOON
      if (currentQ.type === "clinic" && isYes) {
        renderResult("CLINIC_SOON");
        return;
      }

      // Dehydration signs: count the "Yes" answers
      if (currentQ.type === "dehydration" && isYes) {
        dehydrationCount++;
      }

      // Move to the next question, or finish
      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else if (dehydrationCount >= 2) {
        renderResult("CLINIC_SOON");   // 2 or 3 signs
      } else {
        renderResult("HOME_CARE");     // 0 or 1 sign
      }
    }

    // Go back to question 1
    function restartTriage() {
      currentIndex = 0;
      dehydrationCount = 0;
      resultView.classList.add("hidden");
      questionView.classList.remove("hidden");
      renderQuestion();
    }

    /* ==========================================================================
       BUTTON CLICKS
       ========================================================================== */
    btnYes.addEventListener("click", () => handleChoice(true));
    btnNo.addEventListener("click", () => handleChoice(false));
    btnRestartTop.addEventListener("click", restartTriage);
    btnRestartBottom.addEventListener("click", restartTriage);

    // Start by showing the first question
    renderQuestion();
  </script>
</body>
</html>
